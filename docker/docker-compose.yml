# docker-compose.yml — perfiles de prueba para perfanalyzer
#
# Los límites de recursos (cpus, mem_limit) usan la forma "standalone"
# de docker-compose v2. La sección 'deploy.resources' solo aplica en Swarm.
#
# Uso:
#   docker compose --profile baseline  up --build
#   docker compose --profile cpu-limit up --build
#   docker compose --profile mem-limit up --build

services:

  # ── Perfil 1: sin límites de recursos ──────────────────────────────────────
  baseline:
    container_name: perf_baseline
    profiles: ["baseline"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    ports:
      - "8080:8080"
    security_opt:
      - no-new-privileges:true

  # ── Perfil 2: limitado a 1 vCPU ────────────────────────────────────────────
  cpu-limit:
    container_name: perf_cpu_limit
    profiles: ["cpu-limit"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    ports:
      - "8081:8080"
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

  # ── Perfil 3: limitado a 512 MiB ───────────────────────────────────────────
  mem-limit:
    container_name: perf_mem_limit
    profiles: ["mem-limit"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    ports:
      - "8082:8080"
    mem_limit: 512m
    memswap_limit: 512m
    security_opt:
      - no-new-privileges:true
